[project]
name = "firma"
version = "0.1.0"
description = "Um time de agentes que transforma PRDs em PRs, usando a sua assinatura Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "typer>=0.12",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
firma = "firma.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
